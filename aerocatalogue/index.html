<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AeroCatalogue — Aircraft & Helicopters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --navy:#0e1624;
      --navy2:#162032;
      --navy3:#1e2d45;
      --gold:#c09a3a;
      --gold2:#e8c46a;
      --paper:#f7f3e9;
      --paper2:#ede8da;
      --ink:#2d2416;
      --pencil:#7a6a4f;
      --faint:#c4b89a;
      --white:#fffcf5;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Inter',sans-serif;
      --mono:'JetBrains Mono',monospace;
      --r:10px;
      /* category colors */
      --c-narrow:#1B4F7A;
      --c-wide:#1A6040;
      --c-regional:#954E0A;
      --c-turboprop:#5A2A8A;
      --c-cargo:#8A3A10;
      --c-bizjet:#7A5010;
      --c-military:#3A5020;
      --c-seaplane:#0A4A6A;
      --c-heli:#7A1020;
    }

    html{scroll-behavior:smooth;}

    body{
      background:var(--paper);
      font-family:var(--sans);
      color:var(--ink);
      min-height:100vh;
    }

    /* ── HERO ── */
    .hero{
      background:var(--navy);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
      overflow:hidden;
      padding:2rem;
    }

    /* grid overlay */
    .hero::before{
      content:'';
      position:absolute;inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }

    /* radial glow */
    .hero::after{
      content:'';
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:700px;height:700px;
      background:radial-gradient(circle,rgba(192,154,58,0.12) 0%,transparent 70%);
      pointer-events:none;
    }

    .hero-inner{position:relative;z-index:1;}

    .hero-eyebrow{
      font-family:var(--mono);
      font-size:11px;
      letter-spacing:0.2em;
      color:var(--gold);
      text-transform:uppercase;
      margin-bottom:1.5rem;
      display:flex;align-items:center;gap:12px;
    }
    .hero-eyebrow::before,.hero-eyebrow::after{
      content:'';display:inline-block;width:32px;height:1px;background:var(--gold);opacity:0.6;
    }

    .hero-title{
      font-family:var(--serif);
      font-size:clamp(52px,10vw,96px);
      font-weight:700;
      color:#fff;
      letter-spacing:-0.02em;
      line-height:1;
      margin-bottom:2rem;
    }

    .hero-title span{color:var(--gold);}

    .typewriter-wrap{
      height:56px;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:2.5rem;
    }

    .typewriter-label{
      font-family:var(--mono);
      font-size:clamp(14px,2.5vw,22px);
      color:rgba(255,255,255,0.55);
      margin-right:8px;
      letter-spacing:0.04em;
    }

    #typewriter{
      font-family:var(--serif);
      font-size:clamp(16px,3vw,26px);
      color:var(--gold2);
      font-style:italic;
      min-width:280px;
      text-align:left;
      border-right:2px solid var(--gold);
      padding-right:6px;
      animation:blink 0.75s step-end infinite;
    }
    @keyframes blink{0%,100%{border-color:var(--gold);}50%{border-color:transparent;}}

    .hero-stats{
      display:flex;gap:2.5rem;justify-content:center;flex-wrap:wrap;
    }
    .hero-stat{
      text-align:center;
    }
    .hero-stat .num{
      font-family:var(--mono);
      font-size:28px;
      font-weight:500;
      color:#fff;
      display:block;
    }
    .hero-stat .lbl{
      font-size:11px;
      color:rgba(255,255,255,0.4);
      text-transform:uppercase;
      letter-spacing:0.1em;
    }

    .scroll-hint{
      position:absolute;
      bottom:2rem;
      left:50%;
      transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:6px;
      color:rgba(255,255,255,0.3);
      font-size:11px;
      font-family:var(--mono);
      letter-spacing:0.1em;
      text-transform:uppercase;
      animation:bounceY 2s ease-in-out infinite;
    }
    .scroll-hint svg{opacity:0.4;}
    @keyframes bounceY{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(6px);}}

    /* ── STICKY FILTER BAR ── */
    .filter-bar{
      position:sticky;top:0;z-index:100;
      background:rgba(247,243,233,0.95);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid var(--faint);
      padding:14px 24px;
      display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    }

    .search-box{
      display:flex;align-items:center;gap:8px;
      background:var(--white);
      border:1px solid var(--faint);
      border-radius:6px;
      padding:6px 12px;
      flex:0 0 200px;
    }
    .search-box input{
      border:none;background:transparent;outline:none;
      font-family:var(--sans);font-size:13px;color:var(--ink);
      width:100%;
    }
    .search-box input::placeholder{color:var(--faint);}

    .filter-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;}

    .pill{
      font-family:var(--sans);
      font-size:12px;font-weight:500;
      color:var(--pencil);
      background:var(--white);
      border:1px solid var(--faint);
      border-radius:20px;
      padding:5px 14px;
      cursor:pointer;
      transition:background 0.18s,color 0.18s,border-color 0.18s;
      white-space:nowrap;
    }
    .pill:hover{border-color:var(--pencil);color:var(--ink);}
    .pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}

    .count-badge{
      font-family:var(--mono);
      font-size:11px;
      color:var(--pencil);
      margin-left:auto;
      white-space:nowrap;
    }

    /* ── GRID ── */
    .catalogue{
      max-width:1400px;
      margin:0 auto;
      padding:2.5rem 24px 5rem;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    /* ── CARD ── */
    .card{
      background:var(--white);
      border:1px solid var(--faint);
      border-radius:var(--r);
      overflow:hidden;
      cursor:pointer;
      box-shadow:2px 3px 0 rgba(45,36,22,0.06);
      transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
      position:relative;
    }
    .card:hover{
      transform:translateY(-6px) scale(1.03);
      box-shadow:0 16px 40px rgba(14,22,36,0.18);
      z-index:2;
    }
    .card:hover .card-overlay{opacity:1;}

    .card-img{
      width:100%;
      height:150px;
      position:relative;
      overflow:hidden;
      background:linear-gradient(135deg,#ddd8c8,#c8c0aa);
    }
    .card-img img{
      width:100%;height:100%;
      object-fit:cover;
      display:block;
      transition:transform 0.4s ease;
    }
    .card:hover .card-img img{transform:scale(1.06);}

    .card-img .fallback-icon{
      display:none;
      position:absolute;inset:0;
      align-items:center;justify-content:center;
      font-size:3rem;
    }

    .card-overlay{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(14,22,36,0.6) 0%,transparent 60%);
      opacity:0;
      transition:opacity 0.25s;
      display:flex;align-items:flex-end;padding:12px;
    }
    .card-overlay-text{
      font-family:var(--mono);
      font-size:10px;
      color:rgba(255,255,255,0.9);
      letter-spacing:0.08em;
      text-transform:uppercase;
    }

    .card-body{padding:12px 14px 14px;}

    .card-cat{
      font-family:var(--mono);
      font-size:9px;
      font-weight:600;
      letter-spacing:0.1em;
      text-transform:uppercase;
      padding:2px 8px;
      border-radius:20px;
      display:inline-block;
      margin-bottom:6px;
      color:#fff;
    }

    .card-name{
      font-family:var(--serif);
      font-size:16px;
      font-weight:600;
      color:var(--ink);
      line-height:1.2;
      margin-bottom:2px;
    }

    .card-mfg{
      font-size:12px;
      color:var(--pencil);
    }

    .card-specs{
      display:flex;gap:10px;margin-top:10px;
      border-top:1px solid var(--paper2);
      padding-top:10px;
    }

    .card-spec{
      flex:1;text-align:center;
    }
    .card-spec .sv{
      font-family:var(--mono);
      font-size:12px;font-weight:500;
      color:var(--ink);display:block;
    }
    .card-spec .sk{
      font-size:9px;color:var(--faint);
      text-transform:uppercase;letter-spacing:0.06em;
    }

    /* no results */
    .no-results{
      grid-column:1/-1;
      text-align:center;
      padding:5rem 2rem;
      color:var(--pencil);
    }
    .no-results h3{font-family:var(--serif);font-size:24px;margin-bottom:8px;color:var(--ink);}

    /* ── MODAL ── */
    .modal-backdrop{
      position:fixed;inset:0;
      background:rgba(14,22,36,0.75);
      z-index:1000;
      display:flex;align-items:center;justify-content:center;
      padding:24px;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.25s;
    }
    .modal-backdrop.open{opacity:1;pointer-events:all;}

    .modal{
      background:var(--white);
      border-radius:14px;
      overflow:hidden;
      max-width:720px;
      width:100%;
      max-height:90vh;
      overflow-y:auto;
      transform:translateY(32px) scale(0.97);
      transition:transform 0.3s cubic-bezier(0.34,1.4,0.64,1);
      box-shadow:0 32px 80px rgba(0,0,0,0.4);
    }
    .modal-backdrop.open .modal{transform:translateY(0) scale(1);}

    .modal-img{
      width:100%;height:260px;
      position:relative;
      background:linear-gradient(135deg,#ddd8c8,#c8c0aa);
    }
    .modal-img img{width:100%;height:100%;object-fit:cover;display:block;}
    .modal-img .fallback-icon{
      display:none;position:absolute;inset:0;
      align-items:center;justify-content:center;
      font-size:5rem;
    }

    .modal-img-overlay{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(14,22,36,0.65) 0%,transparent 55%);
      display:flex;align-items:flex-end;
      padding:20px 24px;
    }

    .modal-img-title{
      font-family:var(--serif);
      font-size:32px;
      font-weight:700;
      color:#fff;
      letter-spacing:-0.01em;
      line-height:1.1;
    }

    .modal-close{
      position:absolute;top:16px;right:16px;
      width:36px;height:36px;
      background:rgba(14,22,36,0.6);
      border:none;border-radius:50%;
      color:#fff;font-size:18px;
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      backdrop-filter:blur(4px);
      transition:background 0.18s;
    }
    .modal-close:hover{background:rgba(14,22,36,0.9);}

    .modal-body{padding:24px 28px 32px;}

    .modal-header{
      display:flex;align-items:center;gap:12px;
      margin-bottom:20px;
    }
    .modal-cat{
      font-family:var(--mono);
      font-size:10px;font-weight:600;
      letter-spacing:0.1em;
      text-transform:uppercase;
      padding:3px 10px;
      border-radius:20px;
      color:#fff;
    }
    .modal-mfg{
      font-size:14px;color:var(--pencil);
    }
    .modal-wiki{
      margin-left:auto;
      font-family:var(--mono);
      font-size:11px;
      color:var(--pencil);
      text-decoration:none;
      display:flex;align-items:center;gap:4px;
      transition:color 0.18s;
    }
    .modal-wiki:hover{color:var(--ink);}

    .modal-about{
      font-size:15px;
      color:var(--pencil);
      line-height:1.75;
      margin-bottom:22px;
      padding:14px 16px;
      background:var(--paper);
      border-radius:6px;
      border-left:3px solid var(--gold);
    }

    .specs-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
    }

    .spec-box{
      background:var(--paper);
      border:1px solid var(--paper2);
      border-radius:6px;
      padding:12px 14px;
    }
    .spec-key{
      font-family:var(--mono);
      font-size:9px;
      color:var(--faint);
      text-transform:uppercase;
      letter-spacing:0.1em;
      margin-bottom:4px;
    }
    .spec-val{
      font-family:var(--mono);
      font-size:18px;
      font-weight:500;
      color:var(--ink);
      line-height:1;
    }
    .spec-unit{font-size:11px;color:var(--pencil);margin-left:3px;}

    /* ── RESPONSIVE ── */
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:760px){
      .grid{grid-template-columns:repeat(2,1fr);}
      .filter-bar{padding:10px 16px;}
      .search-box{flex:0 0 140px;}
      .catalogue{padding:1.5rem 16px 4rem;}
      .specs-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:480px){
      .grid{grid-template-columns:repeat(2,1fr);gap:12px;}
      .modal-img{height:180px;}
      .modal-img-title{font-size:22px;}
      .modal-body{padding:16px 18px 24px;}
    }
  </style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">Vishwak Vemuru</p>
    <h1 class="hero-title">Aero<span>Catalogue</span></h1>
    <div class="typewriter-wrap">
      <span class="typewriter-label">Now viewing —</span>
      <span id="typewriter"></span>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><span class="num">123</span><span class="lbl">Aircraft</span></div>
      <div class="hero-stat"><span class="num">9</span><span class="lbl">Categories</span></div>
      <div class="hero-stat"><span class="num">16</span><span class="lbl">Helicopters</span></div>
      <div class="hero-stat"><span class="num">8</span><span class="lbl">Seaplanes</span></div>
    </div>
  </div>
  <div class="scroll-hint">
    <svg width="16" height="20" viewBox="0 0 16 20" fill="none"><rect x="1" y="1" width="14" height="18" rx="7" stroke="white" stroke-width="1.5"/><rect x="7" y="4" width="2" height="5" rx="1" fill="white"/></svg>
    Scroll to explore
  </div>
</section>

<!-- FILTER BAR -->
<div class="filter-bar" id="filterBar">
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="#c4b89a" stroke-width="1.5"/><path d="M9 9l3 3" stroke="#c4b89a" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Search aircraft…" autocomplete="off">
  </div>
  <div class="filter-pills" id="filterPills"></div>
  <span class="count-badge" id="countBadge">123 aircraft</span>
</div>

<!-- CATALOGUE GRID -->
<main class="catalogue">
  <div class="grid" id="grid"></div>
</main>

<!-- MODAL -->
<div class="modal-backdrop" id="backdrop" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-img" id="modalImg">
      <img id="modalPhoto" src="" alt="">
      <div class="fallback-icon" id="modalFallback"></div>
      <div class="modal-img-overlay">
        <h2 class="modal-img-title" id="modalTitle"></h2>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-header">
        <span class="modal-cat" id="modalCat"></span>
        <span class="modal-mfg" id="modalMfg"></span>
        <a class="modal-wiki" id="modalWiki" href="#" target="_blank" rel="noopener">Wikipedia ↗</a>
      </div>
      <p class="modal-about" id="modalAbout"></p>
      <div class="specs-grid" id="modalSpecs"></div>
    </div>
  </div>
</div>

<script>
const CAT_LABELS = {
  narrow:'Narrow-body Jet', wide:'Wide-body Jet', regional:'Regional Jet',
  turboprop:'Turboprop/Bush', cargo:'Cargo Specialist', bizjet:'Bizjet/VIP',
  military:'Military Transport', seaplane:'Seaplane/Amphibious', heli:'Helicopter'
};

const CAT_COLORS = {
  narrow:'#1B4F7A', wide:'#1A6040', regional:'#954E0A', turboprop:'#5A2A8A',
  cargo:'#8A3A10', bizjet:'#7A5010', military:'#3A5020', seaplane:'#0A4A6A', heli:'#7A1020'
};

const ABOUT = {
  'a220-100':'A clean-sheet design from Bombardier, completed by Airbus — the A220-100 redefined efficiency on thin regional routes with its advanced geared turbofan engines.',
  'a220-300':'The stretched sibling of the A220-100, offering more seats while retaining the same outstanding fuel burn per seat — a favourite for short to medium haul carriers.',
  'a319neo':'The smallest of the neo family, built for thinner routes and challenging airports with short runways or high altitudes.',
  'a320neo':'The world\'s best-selling single-aisle aircraft, combining CFM LEAP or PW1100G engines with a wide cabin that passengers and operators both love.',
  'a321neo':'The longest-range member of the A320 family, capable of transcontinental routes that previously required much larger aircraft.',
  'a321xlr':'Airbus\'s game-changing Extra Long Range variant — the XLR can fly non-stop from Europe to the US East Coast in a single-aisle jet.',
  'b737-700':'Boeing\'s compact 737NG, widely used by Southwest Airlines and known for its versatility on short to medium routes.',
  'b737-800':'The most successful 737 variant ever — a workhorse on routes worldwide, beloved for its reliability and economics.',
  'b737-900er':'The longest 737NG, stretching capacity while keeping operating costs low on high-demand domestic corridors.',
  'b737max8':'The re-engined 737, featuring LEAP-1B engines and winglets for improved efficiency — a controversial but capable aircraft.',
  'b737max10':'The largest MAX variant, squeezing maximum capacity from the 737 platform to compete with the A321neo.',
  'b757-200':'A legendary narrow-body that punched well above its class, flying transatlantic routes that defied its single-aisle designation.',
  'b757-300':'The stretched 757, trading range for capacity — rare in service but effective for high-density charter operations.',
  'md80':'The MD-80 family defined short-haul air travel through the 1980s and 90s with its distinctive rear-engine layout and narrow cabin.',
  'md90':'An upgraded MD-80 with IAE V2500 engines offering significantly improved noise and fuel burn for its era.',
  'b717':'A compact twin-jet derived from the MD-90, finding success with operators like Delta and Hawaiian Airlines on thin routes.',
  'c919':'China\'s first modern narrow-body, developed by COMAC to compete directly with the A320neo and B737 MAX.',
  'arj21':'China\'s first regional jet, developed by COMAC — a stepping stone in establishing domestic aviation manufacturing capability.',
  'a330-200':'A versatile wide-body that serves both long-haul passengers and cargo operators with equal effectiveness around the world.',
  'a330-300':'The original and most popular A330 variant, a twin-engine workhorse on medium to long haul routes for over three decades.',
  'a330-900neo':'A re-engined A330 with Rolls-Royce Trent 7000 engines, offering substantially better fuel efficiency than its predecessors.',
  'a340-300':'Airbus\'s four-engine answer to transoceanic range — pre-ETOPS rules made its quad-engine layout advantageous for overwater routes.',
  'a340-600':'The longest commercial aircraft by fuselage at its introduction, stretching the A340 platform to carry up to 380 passengers.',
  'a350-900':'Airbus\'s composite-intensive widebody, setting new standards for passenger comfort and fuel efficiency on long-haul routes.',
  'a350-1000':'The stretched A350, matching the 777-300ER\'s capacity while delivering far better fuel burn per seat.',
  'a350-900ulr':'Ultra Long Range — capable of flying 20 hours non-stop, operating the world\'s longest commercial routes for Singapore Airlines.',
  'a380':'The world\'s largest commercial aircraft — a double-deck, four-engine superjumbo that redefined hub-to-hub travel.',
  'b747-400':'The Queen of the Skies — the 747-400 defined premium long-haul travel for a generation with its iconic hump and global reach.',
  'b747-8':'The final and most advanced 747 variant, with a stretched fuselage, raked wingtips, and GEnx engines for improved efficiency.',
  'b767-300er':'A mid-size wide-body that opened transatlantic twin-engine operations before the 777 arrived, still widely used in cargo.',
  'b777-200er':'The original long-range 777 — a twin-engine giant that revolutionised economics on long-haul with its GE90 powerplant.',
  'b777-300er':'The workhorse of long-haul aviation — the 777-300ER\'s combination of capacity and range made it the dominant premium aircraft.',
  'b777x':'Boeing\'s next-generation widebody, featuring folding wingtips and the world\'s largest turbofan engines for unmatched efficiency.',
  'b787-8':'The Dreamliner — Boeing\'s carbon-composite revolution, enabling point-to-point long-haul routes that bypassed hubs entirely.',
  'b787-9':'The most popular Dreamliner variant, stretching capacity while improving range — a favourite of carriers on ultra-long routes.',
  'b787-10':'The longest Dreamliner, optimised for high-density medium to long-haul routes where efficiency per seat matters most.',
  'e170':'Embraer\'s entry into the mainline regional market — a 70-seat jet that blurred the line between regional and mainline operations.',
  'e175':'The most popular E-Jet, perfectly sized for scope clause agreements in the US market and high-frequency operations worldwide.',
  'e190':'A larger E-Jet that challenged narrow-bodies on thinner routes with lower seat costs and a wider cabin than CRJ competitors.',
  'e195':'Embraer\'s largest first-generation E-Jet, stretching capacity to 120 seats while retaining the family\'s operating flexibility.',
  'e190-e2':'The re-engined E190, with Pratt & Whitney GTF engines delivering dramatic improvements in fuel burn and noise footprint.',
  'e195-e2':'The largest E2 variant — dramatically reducing fuel burn per seat to challenge A220 and A320neo economics on thin routes.',

// ── TYPEWRITER ──
const NAMES = [
  'Boeing 747-400','Airbus A380','Gulfstream G700','Lockheed C-130J Hercules',
  'Sikorsky UH-60 Black Hawk','Concorde\'s successor?','Airbus A350-900ULR',
  'Boeing CH-47 Chinook','Bombardier Global 7500','Beriev Be-200 Altair',
  'Leonardo AW139','ShinMaywa US-2','Dassault Falcon 10X','Embraer KC-390',
  'Antonov An-124 Ruslan','Pilatus PC-12'
];
let twIdx=0, twChar=0, twDeleting=false, twEl=document.getElementById('typewriter');
function tick(){
  const word=NAMES[twIdx];
  if(!twDeleting){
    twEl.textContent=word.slice(0,++twChar);
    if(twChar===word.length){twDeleting=true;setTimeout(tick,1800);return;}
    setTimeout(tick,55);
  } else {
    twEl.textContent=word.slice(0,--twChar);
    if(twChar===0){twDeleting=false;twIdx=(twIdx+1)%NAMES.length;}
    setTimeout(tick,twChar===0?400:28);
  }
}
setTimeout(tick,600);

// ── FILTER STATE ──
let activeFilter='all', searchQ='';

// ── BUILD FILTER PILLS ──
const cats=['all',...Object.keys(CAT_LABELS)];
const pillsEl=document.getElementById('filterPills');
cats.forEach(c=>{
  const b=document.createElement('button');
  b.className='pill'+(c==='all'?' active':'');
  b.textContent=c==='all'?'All':CAT_LABELS[c];
  b.onclick=()=>{
    activeFilter=c;
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  pillsEl.appendChild(b);
});

document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.toLowerCase().trim();
  render();
});

// ── RENDER GRID ──
function render(){
  const q=searchQ;
  const filtered=DB.filter(ac=>{
    const catOk=activeFilter==='all'||ac.cat===activeFilter;
    const searchOk=!q||ac.name.toLowerCase().includes(q)||ac.mfg.toLowerCase().includes(q)||(CAT_LABELS[ac.cat]||'').toLowerCase().includes(q);
    return catOk&&searchOk;
  });

  document.getElementById('countBadge').textContent=`${filtered.length} aircraft`;

  const grid=document.getElementById('grid');
  if(filtered.length===0){
    grid.innerHTML=`<div class="no-results"><h3>No aircraft found</h3><p>Try adjusting your search or filter.</p></div>`;
    return;
  }

  grid.innerHTML=filtered.map(ac=>buildCard(ac)).join('');
  // attach click
  grid.querySelectorAll('.card').forEach((el,i)=>{
    el.addEventListener('click',()=>openModal(filtered[i]));
  });
}

// ── BUILD CARD ──
function buildCard(ac){
  const color=CAT_COLORS[ac.cat]||'#7a6a4f';
  const label=CAT_LABELS[ac.cat]||ac.cat;
  return `
  <div class="card">
    <div class="card-img">
      <img src="images/aircraft/${ac.id}.jpg" alt="${ac.name}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="fallback-icon" style="display:none;background:linear-gradient(135deg,#ddd8c8,#c8c0aa);">${ac.heli?'🚁':'✈'}</div>
      <div class="card-overlay"><span class="card-overlay-text">View details</span></div>
    </div>
    <div class="card-body">
      <span class="card-cat" style="background:${color}">${label}</span>
      <div class="card-name">${ac.name}</div>
      <div class="card-mfg">${ac.mfg}</div>
      <div class="card-specs">
        <div class="card-spec"><span class="sv">${ac.range>=1000?(ac.range/1000).toFixed(1)+'k':ac.range}</span><span class="sk">Range km</span></div>
        <div class="card-spec"><span class="sv">${ac.pax||'—'}</span><span class="sk">Pax</span></div>
        <div class="card-spec"><span class="sv">${ac.cruise}</span><span class="sk">km/h</span></div>
      </div>
    </div>
  </div>`;
}

// ── MODAL ──
function openModal(ac){
  const color=CAT_COLORS[ac.cat]||'#7a6a4f';
  const label=CAT_LABELS[ac.cat]||ac.cat;
  const about=ABOUT[ac.id]||`The ${ac.name} is a ${label.toLowerCase()} manufactured by ${ac.mfg}.`;

  document.getElementById('modalTitle').textContent=ac.name;
  document.getElementById('modalMfg').textContent=ac.mfg;
  document.getElementById('modalCat').textContent=label;
  document.getElementById('modalCat').style.background=color;
  document.getElementById('modalAbout').textContent=about;
  document.getElementById('modalWiki').href=ac.wiki||`https://en.wikipedia.org/wiki/${encodeURIComponent(ac.name)}`;

  const photo=document.getElementById('modalPhoto');
  const fallback=document.getElementById('modalFallback');
  photo.style.display='block';
  fallback.style.display='none';
  photo.src=`images/aircraft/${ac.id}.jpg`;
  photo.onerror=()=>{photo.style.display='none';fallback.style.display='flex';fallback.textContent=ac.heli?'🚁':'✈';};

  const fmt=(v,unit,label)=>`<div class="spec-box"><div class="spec-key">${label}</div><div class="spec-val">${v!==0&&v?v.toLocaleString():'—'}<span class="spec-unit">${unit}</span></div></div>`;
  document.getElementById('modalSpecs').innerHTML=
    fmt(ac.range,'km','Range')+
    fmt(ac.pax,'pax','Max Pax')+
    fmt(ac.cargo?Math.round(ac.cargo/1000):'—',ac.cargo?'t':'','Max Cargo')+
    fmt(ac.cruise,'km/h','Cruise Speed')+
    fmt(ac.runway||'N/A',ac.runway?'m':'','Runway Req.')+
    fmt(ac.mtow?Math.round(ac.mtow/1000):'—',ac.mtow?'t':'','MTOW');

  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e.target===document.getElementById('backdrop')) closeModalDirect();
}
function closeModalDirect(){
  document.getElementById('backdrop').classList.remove('open');
  document.body.style.overflow='';
}

// keyboard close
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModalDirect();});

// ── INIT ──
render();
</script>
